# render.yaml — Render Blueprint for Karmayogi Pragya (Single-Service Deployment)
# Place this file in the project root.

services:
  - type: web
    name: karmayogi-pragya
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PIP_EXTRA_INDEX_URL
        value: "https://download.pytorch.org/whl/cpu"
