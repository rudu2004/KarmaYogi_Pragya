<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // ─── Auth Guard: sessionStorage + localStorage fallback ─────────
        (function() {
            var rawUser = sessionStorage.getItem('pragya_user') || localStorage.getItem('pragya_user') || localStorage.getItem('currentUser');
            if (!rawUser) { window.location.replace('login.html'); return; }
            try {
                var user = typeof rawUser === 'string' && (rawUser.startsWith('{') || rawUser.startsWith('[')) ? JSON.parse(rawUser) : { username: rawUser };
                if (!sessionStorage.getItem('pragya_user')) { sessionStorage.setItem('pragya_user', JSON.stringify(user)); }
                if (!localStorage.getItem('userName') && (user.full_name || user.username)) {
                    localStorage.setItem('userName', user.full_name || user.username);
                }
                if (!localStorage.getItem('userRole') && user.role) {
                    localStorage.setItem('userRole', user.role);
                }
                if (!localStorage.getItem('currentUser')) {
                    localStorage.setItem('currentUser', JSON.stringify(user));
                }
                if (user.role === 'supervisor' || user.role === 'admin') { window.location.replace('admin.html'); return; }
            } catch(e) { window.location.replace('login.html'); }
        })();
    </script>
    <title>Karmayogi Pragya - Onboarding</title>
    <link rel="icon" type="image/png" href="./logo.png">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- SweetAlert2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="./css/style.css" rel="stylesheet">

    <!-- Scripts (Deferred) -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script defer src="./js/auth.js"></script>
    <script defer src="./js/api.js"></script>
    <script defer src="./js/charts.js"></script>
    <script defer src="./js/apple_scroll.js"></script>
    <script defer src="./js/ui_logic.js"></script>
</head>
<body>
    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card card-karmayogi w-100" style="max-width: 500px;">
            <div class="text-center mb-4">
                <img src="./logo.png" alt="Karmayogi Pragya Logo" class="mb-3" style="height: 75px; width: auto; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.08));">
                <h2 class="fw-bold" style="color: var(--primary-navy); letter-spacing: -0.5px;">Karmayogi Pragya</h2>
                <p class="text-muted small">Competency Discovery & Learning Intelligence Platform</p>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">Learner Name</label>
                <input type="text" class="form-control" id="learnerName" placeholder="Enter your full name (e.g., Rudraksh Asthana)" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Target Topic / Field <span class="text-muted fw-normal">(type anything)</span></label>
                <input type="text" class="form-control" id="targetTopic"
                       list="topicOptions"
                       placeholder="Enter target topic or competency domain (e.g., Python DSA, Data Engineering)" required>
                <datalist id="topicOptions">
                    <option value="Python & Data Structures">
                    <option value="Statistical Analysis & Sampling">
                    <option value="Database Engineering & SQL">
                    <option value="AI in Public Policy">
                    <option value="Big Data Analytics in Healthcare">
                    <option value="Advanced Time Series Forecasting">
                    <option value="Machine Learning for Governance">
                    <option value="Cybersecurity & Data Privacy">
                    <option value="Cloud Computing & DevOps">
                    <option value="Natural Language Processing">
                </datalist>
                <div class="form-text">You can type any custom field — Pragya AI will generate an adaptive assessment tailored to it.</div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Language / भाषा</label>
                <select class="form-select" id="languageSelector">
                    <option value="en">English</option>
                    <option value="hi">हिन्दी (Hindi)</option>
                </select>
            </div>

            <button class="btn w-100 text-white fw-bold py-2" style="background-color: var(--primary-navy);" onclick="startOnboarding()">Start Diagnostic Assessment <i class="fa-solid fa-arrow-right ms-2"></i></button>
        </div>
    </div>

    <script>
        function startOnboarding() {
            const name = document.getElementById('learnerName').value.trim();
            const topic = document.getElementById('targetTopic').value.trim();
            const lang = document.getElementById('languageSelector').value;

            if (!name || !topic) {
                if (typeof Swal !== 'undefined') {
                    Swal.fire({ icon: 'warning', title: 'Missing fields', text: 'Please enter your name and a topic to continue.' });
                } else {
                    alert('Please fill in all fields.');
                }
                return;
            }

            const btn = document.querySelector('button');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Generating...`;

            initUserSession(name, topic, lang);
            localStorage.setItem('user_intake_domain', topic);
            window.location.href = `assessment.html?topic=${encodeURIComponent(topic)}&lang=${lang}&retake=1`;
        }
    </script>
</body>
</html>
